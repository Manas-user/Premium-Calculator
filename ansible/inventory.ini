[app_servers]
# Localhost or WSL target for local demonstration
localhost ansible_connection=local

# Remote target server example (uncomment for staging/production deployment):
# web01.internal.corp ansible_host=192.168.1.100 ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
